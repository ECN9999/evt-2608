<html lang="en">
<head>

<title>An Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ew:min(322px,88vw); --eml:calc(min(322px,88vw) * -0.5); --ec:56%; --etop:calc(56% - 103px); --ebot:calc(56% + 103px);
    --cw:min(300px,82vw); --cml:calc(min(300px,82vw) * -0.5);
    --flapA:#efe8dc; --flapB:#ddd5c3; --inside:#cdc1ab; --seam:rgba(78,58,36,.55);
    --ink:#2f2b27; --muted:#8b8479; --silver:#aeb3ba; --silver-lo:#8b9099; --btn:#302c28; --btn-2:#433d37; --cream:#ede0cc; --ivory:#fdfcf9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ min-height:100dvh; color:var(--ink); font-family:"EB Garamond",Georgia,serif; overflow-x:hidden;
    background:linear-gradient(180deg, rgba(18,11,6,.48), rgba(14,9,5,.72)), url('https://images.unsplash.com/photo-1506968430777-bf7784a87f23?auto=format&fit=crop&w=1400&q=72') center/cover fixed no-repeat, #241610; -webkit-font-smoothing:antialiased; }
  .gloss{ position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(70% 40% at 50% 2%, rgba(255,226,180,.15), transparent 62%); box-shadow:inset 0 0 200px 60px rgba(0,0,0,.6); }
  .stage{ position:relative; min-height:100dvh; overflow:hidden; perspective:1300px; }
  .kicker{ position:absolute; left:50%; top:11%; transform:translateX(-50%); color:var(--cream); opacity:.9; font-size:16px; font-style:italic; letter-spacing:.05em; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.5); transition:opacity .4s; }

  .ep{ position:absolute; left:50%; margin-left:var(--eml); top:var(--etop); width:var(--ew); height:206px; }
  .e-back{ z-index:1; border-radius:8px; background:linear-gradient(155deg,#f4efe6,#e7e0d2 88%); border:1px solid #ddd6c7; box-shadow:0 22px 40px rgba(0,0,0,.55); }
  .e-inside{ z-index:1; background:linear-gradient(180deg,#d7ccb9,#c7bca6); clip-path:polygon(0 0,100% 0,50% 50%); }
  .e-left{ z-index:4; background:linear-gradient(96deg,#f1ebe1,#e4ddce 72%); clip-path:polygon(0 0,0 100%,50% 50%); }
  .e-right{ z-index:4; background:linear-gradient(264deg,#f1ebe1,#e4ddce 72%); clip-path:polygon(100% 0,100% 100%,50% 50%); }
  .e-bottom{ z-index:4; background:linear-gradient(0deg,#f2ece2,#e6ded0); clip-path:polygon(0 100%,100% 100%,50% 50%); border-bottom-left-radius:8px; border-bottom-right-radius:8px; }
  .seams{ z-index:6; pointer-events:none; }
  .e-flap{ z-index:8; transform-origin:50% 0; background:linear-gradient(180deg,var(--flapA),var(--flapB)); clip-path:polygon(0 0,100% 0,50% 50%);
    box-shadow:0 5px 8px rgba(70,52,30,.24); transition:transform .85s cubic-bezier(.5,.05,.2,1); }
  .flapseam{ z-index:8; transform-origin:50% 0; pointer-events:none; transition:transform .85s cubic-bezier(.5,.05,.2,1); }
  .opening .e-flap,.opening .flapseam{ transform:rotateX(180deg); }
  .folded .e-flap,.folded .flapseam{ z-index:2; }

  .card-clip{ position:absolute; left:50%; margin-left:var(--cml); width:var(--cw); top:0; height:var(--ebot); overflow:hidden; z-index:3; }
  .letter{ position:absolute; left:0; right:0; bottom:206px; width:100%; transform-origin:50% 0; transform:translateY(120%); transition:transform 1.55s cubic-bezier(.2,.7,.2,1); }
  .reveal-on .letter{ transform:translateY(0); }
  .present .card-clip{ z-index:20; overflow:visible; }
  .present .letter{ transition:transform 1.15s cubic-bezier(.25,.6,.2,1); }   /* transform set from JS for exact centring */

  .seal{ position:absolute; left:50%; margin-left:-37px; top:var(--ec); transform:translateY(-50%); width:74px; height:66px; z-index:9; cursor:pointer; border:none; background:none; padding:0;
    transition:transform .6s cubic-bezier(.5,-0.5,.3,1.5), opacity .55s ease; animation:beat 3s ease-in-out infinite; filter:drop-shadow(0 3px 3px rgba(45,6,10,.42)); }
  .seal svg{ width:100%; height:100%; display:block; }
  @keyframes beat{ 0%,100%{transform:translateY(-50%) scale(1);} 10%{transform:translateY(-50%) scale(1.05);} 20%{transform:translateY(-50%) scale(1);} }
  .opening .seal{ transform:translateY(-230%) scale(1.3) rotate(-14deg); opacity:0; }

  .tap-hint{ position:absolute; left:50%; top:calc(56% + 122px); transform:translateX(-50%); color:var(--cream); opacity:.72; font-size:12.5px; letter-spacing:.24em; text-transform:uppercase; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.5); transition:opacity .4s; white-space:nowrap; }
  .gate{ position:absolute; left:50%; top:calc(56% + 110px); transform:translateX(-50%); width:min(300px,84vw); opacity:0; pointer-events:none; text-align:center; transition:opacity .45s ease; }
  .ask .gate{ opacity:1; pointer-events:auto; } .ask .tap-hint{ opacity:0; } .ask .seal{ animation:none; }
  .gate label{ display:block; color:var(--cream); opacity:.85; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; margin:0 0 10px; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .gfield{ position:relative; display:flex; }
  .gate input{ width:100%; font-family:"EB Garamond",serif; font-size:16.5px; padding:12px 44px 12px 16px; border:1px solid rgba(237,224,204,.45); border-radius:10px; background:rgba(253,252,249,.97); color:var(--ink); outline:none; }
  .gate input:focus{ border-color:var(--silver); box-shadow:0 0 0 3px rgba(174,179,186,.3); }
  .peek{ position:absolute; right:8px; top:50%; transform:translateY(-50%); height:32px; width:32px; display:flex; align-items:center; justify-content:center; border:none; background:none; color:#9a938a; cursor:pointer; } .peek svg{ width:19px; height:19px; }
  .open-btn{ margin-top:11px; width:100%; font-family:"EB Garamond",serif; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--ivory); background:var(--btn); border:none; border-radius:10px; padding:12px; cursor:pointer; }
  .gerr{ color:#f2c0b1; font-size:13.5px; min-height:18px; margin:10px 0 0; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .shake{ animation:shake .4s ease; } @keyframes shake{ 0%,100%{transform:translateX(-50%);} 25%{transform:translateX(calc(-50% - 6px));} 50%{transform:translateX(calc(-50% + 5px));} 75%{transform:translateX(calc(-50% - 3px));} }
  .reveal-on .kicker,.reveal-on .tap-hint,.reveal-on .gate{ opacity:0; pointer-events:none; }

  .paper-card{ position:relative; background:linear-gradient(180deg,#ffffff,#fbf9f4); border:1px solid #ece9e1; border-radius:5px; padding:20px 22px 18px; box-shadow:0 26px 50px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.9) inset; }
  .paper-card::before{ content:""; position:absolute; inset:8px; border:1px solid rgba(150,157,167,.4); border-radius:2px; pointer-events:none; }
  .crest{ text-align:center; color:#a11f2a; font-size:12px; margin:0 0 5px; line-height:1; }
  .names{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:29px; line-height:1; text-align:center; margin:0; color:var(--ink); }
  .tagline{ text-align:center; font-style:italic; color:var(--muted); font-size:13.5px; margin:3px 0 0; }
  .rule{ width:44px; height:1px; margin:10px auto; background:linear-gradient(90deg,transparent,var(--silver),transparent); }
  .line{ font-family:"Cormorant Garamond",serif; font-size:19px; text-align:center; margin:0 0 11px; color:var(--ink); }
  .dl .k{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver-lo); margin:0 0 2px; }
  .dl .v{ font-size:13px; color:var(--ink); margin:0 0 8px; line-height:1.26; }
  .getting{ font-size:11px; line-height:1.42; color:#6a6259; background:rgba(150,157,167,.09); border:1px solid rgba(150,157,167,.16); border-radius:4px; padding:8px 10px; margin:0 0 12px; }
  .getting .gk{ display:block; font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver-lo); margin:0 0 3px; }
  .cta{ display:flex; flex-direction:column; gap:6px; }
  .cta a{ display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none; padding:9px; border-radius:6px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
  .cta svg{ width:14px; height:14px; }
  .cta .primary{ background:var(--btn); color:var(--ivory); } .cta .ghost{ background:#fff; color:var(--ink); border:1px solid #d5d2c9; }
  .foot{ text-align:center; color:var(--muted); font-size:9px; letter-spacing:.1em; text-transform:uppercase; margin:9px 0 0; }

  @media (prefers-reduced-motion: reduce){ .letter,.e-flap,.flapseam,.seal{ transition:none; } .seal{ animation:none; } }
</style>
</head>

const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
async function decrypt(pass){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pass)),"PBKDF2",false,["deriveKey"]);

  return JSON.parse(new TextDecoder().decode(pt));

seal.addEventListener("click",()=>{ root.classList.add("ask"); setTimeout(()=>passEl.focus(),380); });
const peek=document.getElementById("peek"),icS=document.getElementById("ic-show"),icH=document.getElementById("ic-hide");
peek.addEventListener("click",()=>{ const s=passEl.type==="password"; passEl.type=s?"text":"password"; icS.style.display=s?"none":"block"; icH.style.display=s?"block":"none"; passEl.focus(); });
const g=id=>document.getElementById(id);
function fill(d){ g("l-names").textContent=d.heading; g("l-tag").textContent=d.tagline; g("l-line").textContent=d.line;
  g("l-when").textContent=d.when; g("l-where").textContent=d.where; g("l-getting").textContent=d.getting_there;
  g("l-gcal").href=d.gcal; g("l-ics").href=URL.createObjectURL(new Blob([d.ics],{type:"text/calendar"})); }
function present(){
  root.classList.add("present");
  requestAnimationFrame(()=>{
    const r=letter.getBoundingClientRect();
    const scale=1.22;
    const dy = 26 - r.top;                         // pull the card DOWN so its top lands 26px from the top
    letter.style.transform = `translateY(${dy}px) scale(${scale})`;
  });
}
async function attempt(){
  const p=passEl.value; if(!p) return; openBtn.disabled=true; gerr.textContent="";
  try{
    const data=await decrypt(p); fill(data);
    root.classList.add("opening");
    if(reduce){ root.classList.add("folded","reveal-on"); present(); return; }
    setTimeout(()=>root.classList.add("folded"),   850);
    setTimeout(()=>root.classList.add("reveal-on"),950);
    setTimeout(present, 3000);
  }catch(e){ openBtn.disabled=false; gerr.textContent="Not quite. Try again.";
    gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake"); passEl.select(); }
}
openBtn.addEventListener("click", attempt);
passEl.addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
</script>
</body>
</html>
