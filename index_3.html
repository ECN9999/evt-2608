<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private Invitation</title>
<style>
  :root{
    --bg:#eceff4; --card:#ffffff; --ink:#111624; --muted:#616b7d; --faint:#8b94a4;
    --line:#e4e8ef; --panel:#f6f8fb; --accent:#16233f; --accent-2:#22335a;
    --ring:rgba(22,35,63,.16); --shadow:0 18px 50px rgba(17,30,55,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, #f3f5f9 0%, var(--bg) 60%);
    color:var(--ink); min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px; max-width:460px; width:100%;
    padding:0; box-shadow:var(--shadow); overflow:hidden;
  }
  .head{ padding:28px 30px 22px; border-bottom:1px solid var(--line); }
  .badge{
    display:inline-flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); background:var(--panel); border:1px solid var(--line); padding:5px 11px; border-radius:999px; font-weight:600;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
  h1{ font-size:23px; line-height:1.2; margin:16px 0 4px; font-weight:680; letter-spacing:-.02em; }
  .sub{ color:var(--muted); font-size:14.5px; margin:0; }
  .body{ padding:24px 30px 28px; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--faint); letter-spacing:.02em; margin:0 0 9px; text-transform:uppercase; }
  .field{ position:relative; display:flex; align-items:center; }
  .field input{
    width:100%; font-size:17px; padding:14px 46px 14px 15px; border:1px solid var(--line); border-radius:13px;
    background:#fff; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--ring); }
  .peek{
    position:absolute; right:8px; height:34px; width:34px; display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; color:var(--faint); cursor:pointer; border-radius:9px;
  }
  .peek:hover{ color:var(--ink); background:var(--panel); }
  .peek svg{ width:20px; height:20px; }
  .go{
    margin-top:14px; width:100%; font-size:15.5px; font-weight:640; color:#fff; background:var(--accent);
    border:none; border-radius:13px; padding:14px; cursor:pointer; transition:background .15s, transform .05s;
  }
  .go:hover{ background:var(--accent-2); }
  .go:active{ transform:translateY(1px); }
  .go:disabled{ opacity:.55; cursor:default; }
  .err{ color:#b23a2a; font-size:13.5px; margin:12px 2px 0; min-height:18px; }

  .event{ display:none; }
  .rows{ margin:2px 0 20px; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .rows .r{ display:flex; gap:14px; padding:13px 16px; border-bottom:1px solid var(--line); font-size:14.5px; }
  .rows .r:last-child{ border-bottom:none; }
  .rows .k{ flex:0 0 74px; color:var(--faint); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.02em; padding-top:1px; }
  .rows .v{ color:var(--ink); }
  .notes{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 17px; font-size:13.6px; white-space:pre-wrap; color:#2c3444; margin:0 0 22px; }
  .actions{ display:flex; flex-direction:column; gap:11px; }
  .actions a{ display:flex; align-items:center; justify-content:center; gap:9px; text-decoration:none; padding:14px; border-radius:13px; font-weight:640; font-size:15px; }
  .primary{ background:var(--accent); color:#fff; }
  .primary:hover{ background:var(--accent-2); }
  .secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); }
  .secondary:hover{ background:var(--panel); }
  .actions svg{ width:18px; height:18px; }
  .foot{ margin:18px 2px 0; font-size:11.5px; color:var(--faint); text-align:center; letter-spacing:.01em; }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <span class="badge"><span class="dot"></span> Private &middot; Confidential</span>
      <h1 id="h-title">You&rsquo;re invited</h1>
      <p class="sub" id="h-sub">Enter the passphrase to view the details.</p>
    </div>

    <div class="body">
      <div id="gate">
        <label for="pass">Passphrase</label>
        <div class="field">
          <input id="pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Enter passphrase">
          <button id="peek" class="peek" type="button" aria-label="Show passphrase" aria-pressed="false">
            <svg id="ic-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="ic-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 6c6.4 0 10 7 10 7a17.3 17.3 0 0 1-3.3 4M6.1 7.3A17.3 17.3 0 0 0 2 12s3.6 7 10 7a9.5 9.5 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <button id="go" class="go">Unlock invitation</button>
        <p id="err" class="err"></p>
      </div>

      <div id="event" class="event">
        <div class="rows">
          <div class="r"><span class="k">When</span><span class="v" id="e-when"></span></div>
          <div class="r"><span class="k">Where</span><span class="v" id="e-where"></span></div>
        </div>
        <div class="notes" id="e-notes"></div>
        <div class="actions">
          <a id="e-gcal" class="primary" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
            Add to Google Calendar
          </a>
          <a id="e-ics" class="secondary" download="invitation.ics">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 21h14"/></svg>
            Download for Apple Calendar (.ics)
          </a>
        </div>
        <p class="foot">Times shown in Melbourne (AEST)</p>
      </div>
    </div>
  </main>

<script>
const BLOB = {"v": 1, "kdf": "PBKDF2-SHA256", "iter": 600000, "salt": "GiOBf3rFtHhRDfyrPmHgdg==", "iv": "H+GIcB/o0AW1Ujrk", "ct": "WWHaCaHprtDuV6F9m8647OvzezReD3hlE04/4fISwIeRgvkYelXdXKTi9A2wsPG372Fj5dRKqW8M2fPJ+CmNe5PoG6THMffRiEyP65M1obi/4EcK7zotMr+HCFOHM8z2M2CcGrkCbrZk3V5M/5NXAXQK/HoG19t1qu+IeNhaKv/51zbHyxdaaMyURKm2mSFhQ4n/ydcRNs8aat6+mPI5wrOiCT4Qcs66EBA7ewL6DJf5aTabLRKLWtgkPu+As0zPYMX7/l5djFOrNBlG19m7DGx4l77lT4aghluDW3QW1lvmHIGW3lO/wuKo0BGjsDsE9OKpmONYDor34Ed4BgDq2UikybgSRWZmYiiPlwvXLzDU0Rwhg7+LoeOBcDOxap2d7LAsuGj7H9v6bAOAjsocrQFMEwcZYszHOgTwL8Bp6JI+gVRY6wipGy3HXRVnM7IydM2MO2Lnjtk89Hf8wKlkRMK3Bs3mPl2sc4vUNkmcOarQkZV73yosOUl/ZCGpagXebxTGRMJzjvgQRMrrbSh8fW4k7/WjKk1Wddrc/YoRUuQYkdy2vDCTXFSTqbR259cz+0dIADPK9w5qPVRrkBrlSJWbSCnQjd7Ap4nhIe/yaSMAPKkyJG8vKWuCTNOBwOyu8qL1gLSVrowPNH+D2mngKkJDIERr4RSEVzOC/0AHuO4LnIr/T7HdKoPd7VHaO12DbVWIjOd75Lz2nC91bX4Gibtq/nCyzGHbvL3hUNCHOxwD6k5YPpZoXHlUTJvg4J4H/X/uUFkfkMZgimi49yAf6peGEc5gkDOrcJM8v3drULhL2w7NC74VwXsCtyTFLrngHMmywDVNOAJaIfz6T6RB2kQfqrjiWiJ/nEfDtyvFryhrDd1EA3VeHo9e4dPR5bLqVu2ffCbTNIOs0dpdki+q5z77s9doVVueXFGeKoEC+cJSkLa1vIktBR5gDttgMlxYGCGjF7wUbdOOSQiez4hKJLZxV1kuIAg0aSBEWwox4dUnKDdCRCaI5nn5vcmtsf2sj844y8LcbMV4rlHoN6m6NgRCNuMQQnSGIO0e1yYPOBW6bXH2+3M73cBb6/BionlzS5ngAsNM/aw9YiuFC9eLlglHCCDQvUUbf9K2ik/CX8zs/tXIY5ZeaYByPWMZpUOYT+juNvGT4HW428LJL/LfWyy4hoQqpnykjDjR+cP7mF3iPH0owqxPY3o7Ko58BjHTplEL6Mx7qICMz1vqmQQj6ebd26WcVGQlAvW6b+LU2PftmdYy4llW+6bERfAG+Wz7gmciQWR5qy+SLfkKSb8pZQJbFq2TwUHCHhrmMdFJlP2S09Ppfng7d0nwcVNbZ79Y+mkuto2VtAWDu78lyc8+imFjg3rAL8uDz1YdjOihyz2kAgZm+ryBMIB8b0Z2Sq7MIw14WeOnA9A0HXk7CEFPPgfTajo+m58wQmDjMSjuC0Hd0Fr1gDKP1ywQpdaL6uSLIuai+bFS9bcBm0/74KTuN7jDZ3kaItsgIQFVgTrl7kQdtp165vo5TvVRBkQ5OI8mX6ZCA7wLJ9IFF3izHMdah/zlJONcfhxr5lQyfgJgqphXKYBimu+IndsPUnM7yrWmAebsr4FIDuD6hYBeW/9PQ5LmSI8FwD+R4MS7qKh5VA3b9HxUE4iwlaR9A4C0h1CEQtNxbM76Nl91Np9iT8Bu2alp2WOHn7t+t1Z/RdmYd8lOuhdoO0T1LmGi6iL3KdfCyN7X6QPPOVOaZvhNiEhFqiiV56Fn2zxGIfVfA7nqlUXStFGaUjKrcCz9itI8Ki++Pxd1Amf6ew37xqos26z482lagHEabRnm6MPo3bpkFn+HZzFEU+dJJsPQ3/hKnbd+3FUCeFsHCxWw/ const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pass){
  const norm = pass.trim().toLowerCase();
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256" },
    baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]
  );
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const passEl = document.getElementById("pass");
const goEl = document.getElementById("go");
const errEl = document.getElementById("err");

// show / hide passphrase
const peek = document.getElementById("peek");
const icShow = document.getElementById("ic-show");
const icHide = document.getElementById("ic-hide");
peek.addEventListener("click", () => {
  const show = passEl.type === "password";
  passEl.type = show ? "text" : "password";
  icShow.style.display = show ? "none" : "block";
  icHide.style.display = show ? "block" : "none";
  peek.setAttribute("aria-pressed", String(show));
  peek.setAttribute("aria-label", show ? "Hide passphrase" : "Show passphrase");
  passEl.focus();
});

async function attempt(){
  const p = passEl.value;
  if(!p) return;
  goEl.disabled = true; errEl.textContent = "Checking\u2026";
  try{
    const data = await decrypt(p);
    document.getElementById("h-title").textContent = data.title;
    document.getElementById("h-sub").textContent = "Confirmed \u2014 add it to your calendar below.";
    document.getElementById("e-when").textContent = data.when;
    document.getElementById("e-where").textContent = data.location;
    document.getElementById("e-notes").textContent = data.notes;
    document.getElementById("e-gcal").href = data.gcal;
    document.getElementById("e-ics").href = URL.createObjectURL(new Blob([data.ics], { type:"text/calendar" }));
    document.getElementById("gate").style.display = "none";
    document.getElementById("event").style.display = "block";
  }catch(e){
    errEl.textContent = "That passphrase didn\u2019t work. Try again.";
    goEl.disabled = false; passEl.select();
  }
}
goEl.addEventListener("click", attempt);
passEl.addEventListener("keydown", e => { if(e.key === "Enter") attempt(); });
passEl.focus();
</script>
</body>
</html>
